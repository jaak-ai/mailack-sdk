[package]
name = "mailack"
version = "0.1.0"
edition = "2021"
description = "Official Rust SDK for the mailack certified email API"
license = "UNLICENSED"
readme = "README.md"
keywords = ["mailack", "email", "api"]
categories = ["api-bindings", "network-programming"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[[example]]
name = "send"
path = "examples/send.rs"
